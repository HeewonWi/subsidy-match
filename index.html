<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>지원사업 맞춤 추천 · 범용 시제품</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>:root{--bg:#f6f7f9;--bg-2:#eef0f3;--panel:#fff;--panel-2:#f3f4f6;--line:#e6e8ec;--text:#1f2328;--muted:#6b7280;--accent:#2f66d0;--accent-dk:#2552a8;--accent-soft:#eaf0fb;--ok:#3f9f6b;--ok-soft:#e6f4ec;--ok-strong:#23764b;--warn:#d98a1c;--warn-soft:#fbf1df;--warn-strong:#a15c07;--err:#d4584f;--err-soft:#fbe9e7;--err-strong:#b3362d}
*{box-sizing:border-box}body{font-family:Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;margin:0;line-height:1.5}
.pv{background:#1e2430;color:#cfd6e4;font-size:13px;padding:8px 24px}.pv b{color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:20px 28px 60px}
.top{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand-s{font-weight:800;font-size:16px}.top-sub{color:var(--muted)}.top-r{margin-left:auto;display:flex;gap:8px;align-items:center}.who{font-size:13px;color:var(--muted);margin:0 6px}
.card{background:var(--panel);border:1px solid #eceef2;border-radius:10px;padding:18px 20px;margin-bottom:14px}
.ctitle{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}.ctitle b{font-size:16px}.ctitle span{font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:10px}.fn{font-size:13px;color:var(--muted)}
.row{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer;min-height:34px;display:inline-flex;align-items:center}
.btn:hover{background:var(--panel-2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.btn.primary:hover{background:var(--accent-dk)}
.st{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;line-height:1.5;white-space:nowrap;margin:0 4px 4px 0}
.st-ok{background:var(--ok-soft);color:var(--ok-strong)}.st-warn{background:var(--warn-soft);color:var(--warn-strong)}.st-err{background:var(--err-soft);color:var(--err-strong)}.st-run{background:var(--accent-soft);color:var(--accent-dk)}.st-wait{background:var(--panel-2);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.fl{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select,.frow input,textarea,select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;font-size:14px;background:var(--panel);width:100%}
.field .fn{font-size:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 16px}
.login{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid #eceef2;border-radius:12px;padding:30px 30px 24px}.brand{font-size:22px;font-weight:800;margin-bottom:6px}
.steps{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin:0 0 16px}
.stp{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--muted)}
.stp i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:700;margin-right:7px;background:var(--bg-2)}
.stp i.dn{background:var(--ok-soft);color:var(--ok-strong)}.stp.on{border-bottom-color:var(--accent);color:var(--text);font-weight:700}.stp.on i{background:var(--accent);color:#fff}
.docrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.docrow:first-of-type{border-top:0}.doc-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.chat{display:flex;flex-direction:column;gap:10px;max-height:540px;overflow:auto}
.bub{max-width:86%;padding:10px 13px;border-radius:10px;background:var(--panel-2);align-self:flex-start;font-size:14px;line-height:1.55}.bub.me{align-self:flex-end;background:var(--accent-soft);color:var(--accent-dk)}
.why{font-size:12.5px;color:var(--muted);margin-top:4px}.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.frow{display:flex;gap:6px;margin-top:12px}
.bar{display:grid;grid-template-columns:104px 1fr 34px;gap:12px;align-items:center;padding:6px 0;font-size:14px}.bl{font-weight:600}.bt{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}.bt i{display:block;height:100%;background:var(--accent);border-radius:99px}.bar b{text-align:right}
.sum{font-size:14px;line-height:1.65;margin-bottom:10px}.qa{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:13.5px;padding:4px 0;border-top:1px solid var(--line)}.qa span{color:var(--muted)}
.rm{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage{padding:16px 18px;border-left:1px solid var(--line)}.stage:first-child{border-left:0}.stage.now{background:var(--accent-soft)}.stt{font-size:16px;font-weight:700;margin:6px 0 8px}.stage ul{margin:0 0 10px;padding-left:18px;line-height:1.7}
.ul{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.ul:first-child{border-top:0}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid #eceef2;border-radius:10px;margin-bottom:14px}
.kpi div{padding:14px 16px}.kpi span{display:block;font-size:13.5px;color:var(--muted)}.kpi b{font-size:26px;font-weight:700}.kpi b.ok{color:var(--ok-strong)}.kpi b.warn{color:var(--warn-strong)}
.fbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.flt{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}.flt select{width:auto;padding:5px 8px}
.rec{display:grid;grid-template-columns:52px minmax(0,1fr) 180px;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.sc{text-align:center}.sc b{display:block;font-size:22px;color:var(--accent-dk)}.sc span{font-size:12px;color:var(--muted)}.rt{font-size:15px;font-weight:600}.rs{text-align:right}.dd{font-weight:700}
.tt{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.6}
textarea{line-height:1.7;resize:vertical}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:13px;padding:8px 6px;border-bottom:1px solid var(--line)}.tbl td{padding:10px 6px;border-bottom:1px solid var(--line)}
.temp{font-size:24px;font-weight:700;letter-spacing:.06em;font-family:ui-monospace,Consolas,monospace;padding:6px 0}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:6px;z-index:50}.toast{background:#1f2328;color:#fff;padding:9px 14px;border-radius:8px;font-size:13.5px}.toast.err{background:var(--err-strong)}.toast.ok{background:#1f2328}
@media (max-width:860px){.two{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}.rec{grid-template-columns:44px 1fr}.rs{grid-column:2;text-align:left}}.signup-link{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:16px;font-size:13.5px;color:var(--muted)}.agree{display:flex;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.55;margin:4px 0 6px}
.qrow{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}.qrow:first-of-type{border-top:0}
.ql{font-weight:600;font-size:14px;padding-top:7px}.need{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;color:var(--accent-dk);background:var(--accent-soft);border-radius:99px;padding:0 7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:36px}
.chip:hover{border-color:#c9d8f5}.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dk);font-weight:600}
@media (max-width:640px){.qrow{grid-template-columns:1fr;gap:6px}}
.qrow input{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;font-size:14px;width:100%;max-width:420px;background:var(--panel)}
</style></head><body>

<script>
(function(){
  var KEY_LS='gsr.unlock';
  function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
  function ub64(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  var P=JSON.parse(document.getElementById('gsr-payload').textContent);
  async function keyFrom(pw){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.s),iterations:P.i,hash:'SHA-256'},base,256))}
  async function open(raw){var k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.v)},k,b64(P.c));var o=JSON.parse(new TextDecoder().decode(buf));window.GSR_DATA=o.data;var sc=document.createElement('script');sc.textContent=o.app;document.body.appendChild(sc)}
  function gate(msg){var app=document.getElementById('app');app.innerHTML='';
    var box=document.createElement('div');box.className='login';
    box.innerHTML='<div class="brand">지원사업 맞춤 추천</div><div class="hint" style="margin:0 0 18px">받은 비밀번호를 넣으면 들어갈 수 있습니다.</div><label class="field"><span class="fl">비밀번호</span><input type="password" id="gpw" autocomplete="current-password"></label><label class="agree" style="margin:0 0 4px"><input type="checkbox" id="grem" checked style="width:auto;margin:0 8px 0 0"><span>이 기기에서 기억하기</span></label><button class="btn primary" id="gbtn" style="width:100%;margin-top:10px;justify-content:center">들어가기</button><div class="hint" id="gmsg" style="color:var(--err-strong)">'+(msg||'')+'</div>';
    app.appendChild(box);var pw=box.querySelector('#gpw'),bt=box.querySelector('#gbtn');
    async function go(){bt.disabled=true;bt.textContent='확인 중';try{var raw=await keyFrom(pw.value);await open(raw);if(box.querySelector('#grem').checked)localStorage.setItem(KEY_LS,ub64(raw));}catch(e){bt.disabled=false;bt.textContent='들어가기';box.querySelector('#gmsg').textContent='비밀번호가 맞지 않습니다.';pw.select();}}
    bt.onclick=go;pw.onkeydown=function(e){if(e.key==='Enter')go()};setTimeout(function(){pw.focus()},0)}
  var saved=localStorage.getItem(KEY_LS);
  if(saved){open(b64(saved)).catch(function(){localStorage.removeItem(KEY_LS);gate('')})}else gate('');
})();
</script>
